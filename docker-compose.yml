# Run the Flask app in Docker (local demo for the assignment).
# Requires Docker Desktop: docker compose up --build
services:
  web:
    build: .
    image: sc-assignment1:local
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
